{% set name = "sklearn-genetic-opt" %}
{% set version = "0.14.0" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: cd0ac5648e0b0b0ea883752d8fbd17469459762e48d0db6fd154d879b013ba23

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=77
    - wheel
  run:
    - python >={{ python_min }}
    - scikit-learn >=1.5.0
    - numpy >=1.26.0
    - deap >=1.4.0
    - scipy
    - tqdm >=4.60.0
    - pandas >=1.3.0

test:
  imports:
    - sklearn_genetic
    - sklearn_genetic.callbacks
    - sklearn_genetic.schedules
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/rodrigo-arenas/Sklearn-genetic-opt
  summary: Scikit-learn models hyperparameter tuning and feature selection using evolutionary algorithms
  license: MIT
  license_file: LICENSE
  doc_url: https://sklearngeneticopt.rodrigo-arenas.com/
  dev_url: https://github.com/rodrigo-arenas/Sklearn-genetic-opt

extra:
  recipe-maintainers:
    - goanpeca
    - rodrigo-arenas
